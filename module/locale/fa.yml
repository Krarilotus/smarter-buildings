dynamic: جابه‌جایی خودکار درها هنگام مسدود شدن
dynamic_tooltip: کلبه‌ها، نمازخانه‌ها، کلیساها، کلیساهای جامع، میخانه، عطاری، چاه، منبع آب، بازار، اصطبل‌ها، صنف‌ها و قفس سگ‌ها مدام در خود را بررسی می‌کنند. اگر چیزی جلوی آن ساخته شود یا غیرقابل دسترس گردد، در به یک ضلع آزاد ساختمان منتقل می‌شود. پیش‌تر فقط همان ضلعی که هنگام ساخت انتخاب شده بود به کار می‌رفت.
storage: درهای انبار غله و اسلحه‌خانه نیز جابه‌جا می‌شوند
storage_tooltip: انبار غله و اسلحه‌خانه نیز درهای خود را به همین شکل بررسی می‌کنند تا اگر دروازه یا دیواری در قدیمی را از کارگاه‌ها جدا کرد، کالاها همچنان تحویل داده شوند.
unstuck: کارگران گیرکرده در دیگری را امتحان می‌کنند
unstuck_tooltip: وقتی کسی از ساختمان خود بیرون می‌آید و راهی به مقصدش نمی‌یابد — کارگر به سوی انبار کالا، انبار غله، اسلحه‌خانه یا دژ مرکزی، مادر و کودکان به سوی آتش اردوگاه، کشیش، میخانه‌دار یا دلقک در گشت خود — به داخل برمی‌گردد و در بعدی دور ساختمان (ساعت‌گرد) را امتحان می‌کند تا یکی کار کند. اگر هیچ‌کدام کار نکند، در سر جای خود می‌ماند.
button: دکمهٔ تعمیر برای هر ساختمان آسیب‌دیده
button_tooltip: |-
  هر ساختمان آسیب‌دیدهٔ شما دکمهٔ تعمیر را نشان می‌دهد. هزینهٔ تعمیر به نسبت آسیب از قیمت ساختمان محاسبه می‌شود: نصف ویران، نصف قیمت. بردن نشانگر روی دکمه هزینه و موجودی شما را مانند برج‌ها نشان می‌دهد (نیازمند روشن بودن متن‌های راهنمای بازی است).
gold: تعمیرات طلا نیز مصرف می‌کنند
gold_tooltip: ساختمان‌هایی که هزینهٔ طلا دارند (مانند کلیساها) برای تعمیر نیز همان سهم طلا را مصرف می‌کنند. بدون این گزینه، مانند برج‌ها در بازی عادی فقط چوب و سنگ دریافت می‌شود.
fire_blocks: ممنوعیت تعمیر هنگام سوختن ساختمان
fire_blocks_tooltip: |-
  ساختمان در حال سوختن مانند حضور دشمن در نزدیکی حساب می‌شود: دکمهٔ تعمیر تا خاموش شدن آتش غیرفعال می‌ماند. برای برج‌ها و دروازه‌ها نیز اعمال می‌شود.
ai: هوش مصنوعی
ai_tooltip: هر بار پس از گذشت بازهٔ تعمیر، لرد هوش مصنوعی ساختمان‌های خود (از جمله برج‌ها و دروازه‌ها) را بررسی کرده و آسیب‌دیده‌ترین را تعمیر می‌کند؛ به شرط آنکه طلایش بیش از حداقل باشد، آنجا آتشی نباشد و دشمنی نزدیک نباشد. چوب و سنگ کم را از بازار می‌خرد. فایل‌های شخصیت هوش مصنوعی می‌توانند بازه و حداقل را برای هر لرد با فیلدهای AIC ‏BuildingRepairInterval و BuildingRepairMinimumGold تعیین کنند (نیازمند ماژول aicloader).
ai_damage: تعمیر هوش مصنوعی از این میزان آسیب به بالا (درصد)
ai_interval: بازهٔ تعمیر هوش مصنوعی (ثانیه)
ai_minimum_gold: تعمیر هوش مصنوعی تنها با طلای بیشتر از
firemen: توزیع آتش‌نشان‌ها میان چند آتش‌سوزی
firemen_tooltip: هنگام وجود چند آتش‌سوزی، هر آتش‌نشان به‌جای دویدن همه به سوی یک آتش، آتشی را برمی‌گزیند که آتش‌نشان دیگری در راه آن نیست.
maces: آهنگری‌های جدید گرز می‌سازند
maces_tooltip: کارگاه آهنگری تازه ساخته‌شده به‌جای شمشیر با تولید گرز شروع می‌کند. همچنان می‌توانید آن را عوض کنید. به‌طور پیش‌فرض خاموش است.
breed: اصطبل‌ها اسب‌های برداشته‌شده توسط شوالیه‌ها را جایگزین می‌کنند
breed_tooltip: هنگامی که شوالیه‌ای اسب برمی‌دارد، اصطبل بلافاصله پرورش اسب تازه را آغاز می‌کند. پیش‌تر آن جایگاه تا مرگ شوالیه خالی می‌ماند و هر اصطبل فقط چهار شوالیه را تأمین می‌کرد. خاموش کردن آن زمان‌بندی و پنل اصلی اصطبل را برمی‌گرداند.
stable_panel: پنل اصطبل اسب‌های زنده و پیشرفت اسب بعدی را نشان می‌دهد
stable_panel_tooltip: عدد «در حال استفاده» شوالیه‌های زنده سوار بر اسب‌های این اصطبل را می‌شمارد و نواری مانند نوار سلامتی برج‌ها پیشرفت اسب بعدی را نشان می‌دهد. هنگام پر بودن هر چهار جایگاه، نوار پر است.
breed_seconds: زمان پرورش یک اسب (ثانیه)
slowdown: کند شدن پرورش اسب با افزایش تعداد اسب‌های زنده
slowdown_tooltip: اسب‌های زندهٔ یک اصطبل شامل اسب‌های داخل اصطبل و شوالیه‌های سوار بر اسب‌های آن است. کمتر از تعداد عادی با سرعت عادی پرورش می‌یابد؛ هر اسب اضافه کندتر از قبلی تا رسیدن به کندترین زمان — اصطبل هرگز از پرورش نمی‌ایستد. با کشته شدن شوالیه‌ها دوباره سریع می‌شود.
normal_horses: تعداد اسب‌های زنده پیش از کند شدن پرورش
slowdown_factor: ضریب کند شدن برای هر اسب اضافی
slowest_seconds: کندترین زمان پرورش (ثانیه)
dairy_scrub: امکان ساخت لبنیاتی روی بوته‌زار تنک
dairy_scrub_tooltip: مزرعه به خاک حاصل‌خیز کافی نیاز دارد که معمولاً فقط علف واحه و بوته‌زار متراکم حساب می‌شود. برای لبنیاتی بوته‌زار تنک نیز حساب می‌شود. مزارع گندم، رازک و سیب تغییری نمی‌کنند.
ground_overlay: نمایش زمین نامناسب مزارع به رنگ قرمز
ground_overlay_tooltip: هنگام گذاشتن مزرعه، هر خانهٔ زیر آن که علف نباشد (خاک، شن، سنگ، آهن و غیره) مانند صخره‌ها و ساختمان‌ها قرمز نشان داده می‌شود تا مانع ساخت را ببینید. شرایط زمین مزارع تغییری نمی‌کند.
keep_cows: باقی ماندن گاوها پس از مرگ دامدار
keep_cows_tooltip: با کشته شدن دامدار، گاوهایش به‌جای ناپدید شدن در مزرعه می‌مانند تا دباغان همچنان آن‌ها را ببرند و دامدار جدید آن‌ها را آنجا بیابد. با تخریب یا خواباندن مزرعه گاوها همچنان ناپدید می‌شوند.
hunters_tannery: بردن لاشه از دباغی توسط شکارچیان هنگام نبود گوزن
hunters_tannery_tooltip: هر گاوی که دباغ پوست می‌کند لاشه‌ای در دباغی می‌گذارد. وقتی گوزنی در نقشه نمانده باشد، شکارچی بیکار به دباغی دارای لاشهٔ لرد خود می‌رود، چند لاشه به کلبه‌اش می‌برد، به گوشت تبدیل می‌کند (به‌اندازهٔ یک گوزن) و به انبار غله می‌رساند.
ai_decorations: جلوگیری از انباشت پرچم، منقل یا سر روی نیزهٔ هوش مصنوعی
ai_decorations_tooltip: هوش مصنوعی پرچم‌ها (یا سرهای روی نیزه) و منقل‌های لرد خود را در نقاط ثابت قلعه می‌گذارد و هرگاه نباشد یکی اضافه می‌کند. پیش‌تر فقط بالاترین شیء خانه را می‌دید، در نتیجه پرچم دژ، گردوغبار یا کلاغ باعث انباشت بی‌پایان می‌شد. اکنون همهٔ اشیاء خانه را می‌بیند و تزئینات انباشته یا معلق خود را پاک می‌کند.
